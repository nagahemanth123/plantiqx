<!-- PlantiqX wordmark snippet: "Plantiq" in Space Grotesk 700 + the X mark as the last letter.
     Use: <div class="pqx-logo">Plantiq<img src="PATH/brand/mark.svg" alt="X"></div>
     On dark grounds: add class "on-dark" (white text, mark keeps purple+orange). -->
<style>
.pqx-logo{display:inline-flex;align-items:center;font-family:"Space Grotesk",sans-serif;font-weight:700;color:#5925DC;letter-spacing:-0.035em;line-height:1}
.pqx-logo img{height:.76em;margin-left:.07em;transform:translateY(-.015em)}
.pqx-logo.on-dark{color:#fff}
</style>
